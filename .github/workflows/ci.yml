name: CI

# Runs on every push to main and on every pull request.
# There is no test suite in the public repository. What CI checks instead:
#   1. the runtime dependencies install cleanly on Windows,
#   2. the application package still imports,
#   3. the PyInstaller spec still produces the Windows executable.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Import and build on Windows
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      # Qt needs a platform plugin; offscreen lets the import run without a desktop.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      # Catches syntax errors, broken imports and missing modules early.
      - name: Smoke import
        run: python -c "import screentext_ocr, screentext_ocr.app"

      # The release workflow builds with the same spec, so this keeps it honest.
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean ScreenTextOCR.spec
