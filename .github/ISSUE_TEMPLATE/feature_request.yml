name: Feature request
description: Suggest an improvement for ScreenText OCR
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: input
    id: version
    attributes:
      label: Version
      description: "Optional. The ScreenText OCR version you are using."
      placeholder: "2.2.0"
  - type: markdown
    attributes:
      value: |
        Please keep requests focused on the OCR workflow, GUI, localization or release tooling.
